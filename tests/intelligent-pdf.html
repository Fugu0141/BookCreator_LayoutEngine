<!doctype html>
<html lang="en"><meta charset="utf-8"><title>IL PDF acceptance fixture</title><body>
<script type="module">
import {createPlainTextPagePreview,createIntelligentPrintTicket,createVerifiedIntelligentPrintPreview} from '/dist/index.js';
globalThis.ilPdfReady=(async()=>{
 const paper={width:100000,height:120000,top:12000,bottom:8000,inner:13000,outer:7000,firstSide:'right'};
 const texts=['ILALPHA','ILBETA','ILPIN','ILEND'];
 const options={revision:'pdf-acceptance',fingerprint:'pdf-acceptance-v1',paper,width:80000,height:100000,
  blocks:texts.map(blockKey=>({origin:{documentId:'fixture',revision:'pdf-acceptance',blockKey},request:{text:blockKey,width:24000,fontSize:3500,fontFamily:'sans-serif',lineHeight:1.5},splitPolicy:'strict'})),
  intelligentLayout:{gap:2000,intents:[
   {documentId:'fixture',blockKey:'ILALPHA',placement:{sideBySide:true,sizeConstraints:{minWidth:32000}}},
   {documentId:'fixture',blockKey:'ILBETA',placement:{sideBySide:true}},
   {documentId:'fixture',blockKey:'ILPIN',placement:{fixed:{page:1,x:11000,y:30000}}},
   {documentId:'fixture',blockKey:'ILEND',placement:{fixed:{page:3,x:9000,y:18000}}}
  ]}};
 const frame=document.createElement('iframe');document.body.append(frame);
 let ticket;
 try{
  const screen=await createPlainTextPagePreview(frame.contentDocument,options);
  ticket=JSON.parse(JSON.stringify(createIntelligentPrintTicket(screen,paper)));
 }finally{frame.remove();}
 const preview=await createVerifiedIntelligentPrintPreview(document,options,ticket);
 // Test-only adapter mirrors BookCreator trial-print styling. No new pagination.
 const pages=[...preview.element.shadowRoot.children];
 if(pages.length!==4||preview.plan.pages[2].fragments.length!==0)throw Error('Expected four pages including explicit blank');
 const expected=preview.plan.pages.map(p=>p.fragments.map(f=>{
  const left=p.index%2===0?paper.inner:paper.outer;
  return {text:f.origin.blockKey,x:left+f.rect.x,y:paper.top+f.rect.y,width:f.rect.width,height:f.rect.height};
 }));
 const style=document.createElement('style');
 style.textContent='@page{size:100mm 120mm;margin:0}html,body{margin:0;padding:0;background:white}';
 document.head.append(style);
 for(const [i,page] of pages.entries()){
  Object.assign(page.style,{border:'0',margin:'0',breakInside:'avoid',breakAfter:i===pages.length-1?'auto':'page',printColorAdjust:'exact',webkitPrintColorAdjust:'exact'});
  for(const guide of page.querySelectorAll(':scope > [data-content-guide]'))guide.style.display='none';
 }
 document.body.replaceChildren(preview.element);
 await document.fonts.ready;
 return {paper,expected,publicationReady:preview.publicationReady};
})();
</script></body></html>
