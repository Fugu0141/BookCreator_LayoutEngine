      assert(Array.from(exact.element.shadowRoot.children).every((node,i)=>node.isEqualNode(i<2?reconstruct(resumed,i):Array.from(edited.changedElement.shadowRoot.children).find(page=>Number(page.dataset.page)===i))),'standalone edit DOM parity');
    }

  }
  await phase("node-free display math artifact");
  {
    const source='\\frac{a}{b}',width=80000,size=5000;
    const original=await measureDisplayMath(document,source,width,size,'2.3');
    const handle=displayMathArtifact(original);
    assert(handle&&Object.isFrozen(handle),'successful measurement issues opaque artifact');
    const restored=restoreDisplayMathArtifact(document,handle);
    assert(restored.width===original.width&&restored.height===original.height&&restored.element.isEqualNode(original.element),'numbered equation restores exact node and dimensions');
    assert(restored.element!==original.element&&!restored.element.isConnected,'fresh detached math node');
    original.element.textContent='mutated';
    assert(restored.element.querySelector('mfrac')&&restored.element.querySelector('[data-equation-number]').textContent==='(2.3)','artifact independent of old DOM');
    assert(restoreDisplayMathArtifact(document,displayMathArtifact(restored)).element.isEqualNode(restored.element),'artifact works across generations');
    for(const [doc,artifact] of [[document,{kind:'display-math-artifact'}],[document.implementation.createHTMLDocument('foreign'),handle]]){
      let rejected=false;try{restoreDisplayMathArtifact(doc,artifact);}catch{rejected=true;}
      assert(rejected,'forged or foreign math artifact rejected');
    }
    const make=(revision,number='2.3',formula=source)=>({revision,fingerprint:'numbered-retained-'+revision,width,height:100000,blocks:[{
      origin:{documentId:'numbered-retained',revision,blockKey:'formula'},
      request:{...request,text:formula,width,fontSize:size},displayMath:true,equationNumber:number,splitPolicy:'strict'
    }]});
    const first=await createRetainedTextPagePreview(document,make('1'));
    const second=await createRetainedTextPagePreview(document,make('2'),first.pageDelta.snapshot);
    assert(second.measurementWork.measuredBlocks===0&&second.measurementWork.reusedBlocks===1,'unchanged numbered equation not remeasured');
    assert(second.measurementWork.sharedSnapshotEntries===1,'numbered formula value shared, not its live node');
    const originalPage=first.changedElement.shadowRoot.firstElementChild,originalFormula=originalPage.querySelector('mfrac');
    const exact=await createPlainTextPagePreview(document,make('2'));
    assert(JSON.stringify(second.pageDelta.reusedPageIndices)===JSON.stringify([0])&&second.changedElement.shadowRoot.children.length===0,'unchanged numbered page generates no DOM');
    assert(originalPage.isEqualNode(exact.element.shadowRoot.firstElementChild)&&JSON.stringify(second.plan)===JSON.stringify(exact.plan)&&JSON.stringify(second.slices)===JSON.stringify(exact.slices),'retained numbered page parity');
    assert(first.changedElement.shadowRoot.firstElementChild===originalPage&&originalPage.querySelector('mfrac')===originalFormula&&originalFormula!==exact.element.shadowRoot.querySelector('mfrac'),'prior formula node not moved or replaced');
    const renumbered=await createRetainedTextPagePreview(document,make('3','2.4'),second.pageDelta.snapshot);
    assert(renumbered.measurementWork.measuredBlocks===1,'equation number changes invalidate measurement');
    assert(renumbered.pageDelta.reusedPageIndices.length===0&&renumbered.changedElement.shadowRoot.querySelector('[data-equation-number]').textContent==='(2.4)','renumbering regenerates the equation page');
    assert(renumbered.changedElement.shadowRoot.firstElementChild.isEqualNode((await createPlainTextPagePreview(document,make('3','2.4'))).element.shadowRoot.firstElementChild),'renumbered DOM parity');
    const edited=await createRetainedTextPagePreview(document,make('4','2.4','x^2'),renumbered.pageDelta.snapshot);
    assert(edited.measurementWork.measuredBlocks===1,'formula content changes invalidate measurement');
    assert(edited.pageDelta.reusedPageIndices.length===0&&edited.changedElement.shadowRoot.firstElementChild.isEqualNode((await createPlainTextPagePreview(document,make('4','2.4','x^2'))).element.shadowRoot.firstElementChild),'edited standalone formula regenerates exact DOM');
  }
  await phase("multiline display source and exact offsets");
  {
    const formula=['\\begin{aligned}','  x&=1 \\\\','  &=2-1','\\end{aligned}'].join('\r\n');
    const req={...request,text:formula,width:100000};
    const block={origin:{documentId:'multi',revision:'1',blockKey:'multi',range:{start:10,end:10+formula.length}},request:req,sourceTextStart:10,displayMath:true,splitPolicy:'strict'};
    const options={revision:'1',fingerprint:'multiline-math',width:100000,height:100000,blocks:[block]};
    const p=await createPlainTextPagePreview(document,options);
    assert(p.slices.length===1&&p.slices[0].sourceSlice.start===10&&p.slices[0].sourceSlice.end===10+formula.length,'raw CRLF formula range');
    assert(p.element.shadowRoot.querySelectorAll('mtable mtr').length===2,'multiline display native MathML');
    const primary='前。\n\uFFFC\n後。',hint='ヒント。\n\uFFFC';
    const multi={...multiBlock,sourceTextStart:undefined,request:{...request,text:primary,multiline:true,inlineMath:[{start:primary.indexOf('\uFFFC'),formula,display:true}]},namedSlots:[{name:'hint',request:{...slotRequest,text:hint,multiline:true,inlineMath:[{start:hint.indexOf('\uFFFC'),formula,display:true}]}},multiBlock.namedSlots[1]]};
    const q=await createPlainTextPagePreview(document,{...multiOptions,height:190000,blocks:[multi]});
    assert(q.element.shadowRoot.querySelectorAll('[data-slot-display-math] mtable').length===2,'primary and named multiline display formulas');
    const retainedOptions={...multiOptions,height:190000,blocks:[multi]};
    const first=await createRetainedTextPagePreview(document,retainedOptions);
    const next=await createRetainedTextPagePreview(document,{...retainedOptions,revision:'next'},first.pageDelta.snapshot);
    const full=await createPlainTextPagePreview(document,{...retainedOptions,revision:'next'});
    assert(next.measurementWork.measuredBlocks===0&&next.measurementWork.reusedBlocks===1,'primary and named slot display artifacts avoid measurement');
    assert(JSON.stringify(next.plan)===JSON.stringify(full.plan)&&JSON.stringify(next.slices)===JSON.stringify(full.slices),'slot display retained plan and slices parity');
    const priorPage=first.changedElement.shadowRoot.firstElementChild;
    assert(JSON.stringify(next.pageDelta.reusedPageIndices)===JSON.stringify([0])&&next.changedElement.shadowRoot.children.length===0,'unchanged component display rows omit page DOM');
    assert(priorPage.isEqualNode(full.element.shadowRoot.firstElementChild),'slot display retained DOM parity');
    const primaryEdit={...multi,request:{...multi.request,inlineMath:[{...multi.request.inlineMath[0],formula:formula.replace('x&=1','x&=3')}]}};
    const slotEdit={...multi,namedSlots:[{...multi.namedSlots[0],request:{...multi.namedSlots[0].request,inlineMath:[{...multi.namedSlots[0].request.inlineMath[0],equationNumber:'2.4'}]}},multi.namedSlots[1]]};
    for(const [i,editedBlock] of [primaryEdit,slotEdit].entries()){
      const opts={...retainedOptions,revision:'slot-edit-'+i,blocks:[editedBlock]};
      const edited=await createRetainedTextPagePreview(document,opts,next.pageDelta.snapshot),exact=await createPlainTextPagePreview(document,opts);
      assert(edited.pageDelta.reusedPageIndices.length===0,'changed embedded formula or number invalidates page');
      assert(edited.changedElement.shadowRoot.firstElementChild.isEqualNode(exact.element.shadowRoot.firstElementChild)&&!priorPage.isEqualNode(exact.element.shadowRoot.firstElementChild),'edited slot display DOM parity');
      assert(JSON.stringify(edited.plan)===JSON.stringify(exact.plan)&&JSON.stringify(edited.slices)===JSON.stringify(exact.slices),'edited slot plan and slices parity');
    }
    assert(first.changedElement.shadowRoot.querySelectorAll('[data-slot-display-math] mtable').length===2,'original slot nodes remain in prior paper');
    for(const bad of [{...block,displayMath:undefined},{...block,request:{...req,text:'\uFFFC',inlineMath:[{start:0,formula}]},displayMath:undefined,sourceTextStart:undefined}]){
      let rejected=false;try{await createPlainTextPagePreview(document,{...options,blocks:[bad]});}catch{rejected=true;}
      assert(rejected,'ordinary/inline source cannot contain multiline formula');
    }
    assert(document.body.children.length===before,'multiline display cleanup');
  }
  const median=values=>{const sorted=[...values].sort((a,b)=>a-b),middle=Math.floor(sorted.length/2);return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;};
  const mathCacheSummary=[...new Set(mathCacheComparisons.map(p=>p.scenario))].map(scenario=>{
    const pairs=mathCacheComparisons.filter(p=>p.scenario===scenario);
    return {scenario,pairs:pairs.length,nativeMedianMs:median(pairs.map(p=>p.native.elapsedMs)),cachedMedianMs:median(pairs.map(p=>p.cached.elapsedMs)),
      pairedDeltaMedianMs:median(pairs.map(p=>p.deltaMs)),nativeMeasurementMedianMs:median(pairs.map(p=>p.native.timings.measurementMs)),
      cachedMeasurementMedianMs:median(pairs.map(p=>p.cached.timings.measurementMs)),
      cachedWins:pairs.filter(p=>p.deltaMs<0).length,inlinePlacements:pairs.reduce((n,p)=>n+p.cached.delta.inline.placements,0),
      inlineFallbacks:pairs.reduce((n,p)=>n+p.cached.delta.inline.placementFallbacks,0),
      displayFallbacks:pairs.reduce((n,p)=>n+p.cached.delta.display.fallbacks,0)};
  });
  const paragraphSummary=[...new Set(paragraphComparisons.map(p=>p.change))].map(change=>{
    const pairs=paragraphComparisons.filter(p=>p.change===change);
    return {change,pairs:pairs.length,nativeMedianMs:median(pairs.map(p=>p.native.elapsedMs)),incrementalMedianMs:median(pairs.map(p=>p.incremental.elapsedMs)),
      nativeMeasurementMedianMs:median(pairs.map(p=>p.native.timings.measurementMs)),incrementalMeasurementMedianMs:median(pairs.map(p=>p.incremental.timings.measurementMs)),
      pairedDeltaMedianMs:median(pairs.map(p=>p.deltaMs)),incrementalWins:pairs.filter(p=>p.deltaMs<0).length,
      hits:pairs.reduce((n,p)=>n+p.incremental.delta.hits,0),misses:pairs.reduce((n,p)=>n+p.incremental.delta.misses,0)};
  });
  result.textContent='PASS '+JSON.stringify({lineCount:lines.lines.length,previewPages:preview.plan.pages.length,lineRanges:preview.slices.map(s=>[s.textStart,s.textEnd])})+' '+JSON.stringify({wide,narrow,pages:plan.pages.length})+' MATH_BENCH '+JSON.stringify({version:2,mathBenchmark,mathCacheComparisons,mathCacheSummary})+' PARAGRAPH_BENCH '+JSON.stringify({version:1,paragraphComparisons,paragraphSummary});
}catch(error){result.textContent='FAIL '+String(error);}
await fetch('/test-result',{method:'POST',body:result.textContent});
</script></body></html>
