<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Browser measurement smoke test</title>
<body><pre id="result">RUNNING</pre>
<script type="module">
import {measurePlainText,paginateMeasured,measurePlainTextLines,createPlainTextPagePreview} from '/dist/index.js';
const result=document.querySelector('#result');
const assert=(condition,message)=>{if(!condition)throw Error(message);};
try{
  const before=document.body.children.length;
  const text='実測組版の検証。The quick brown fox jumps over the lazy dog. '.repeat(8);
  const opts={text,fontSize:4200,fontFamily:'sans-serif',lineHeight:1.4};
  const wide=await measurePlainText(document,{...opts,width:150000});
  const narrow=await measurePlainText(document,{...opts,width:50000});
  assert(narrow.height>wide.height,'narrow text should wrap to more lines');
  assert(wide.height===Math.ceil(wide.cssHeight*25400/96),'physical unit conversion');
  assert(narrow.publicationReady===false&&narrow.splitCapability==='none','experimental contract');
  const literal=await measurePlainText(document,{...opts,text:'<img src=x onerror=alert(1)>',width:100000});
  assert(literal.height>0&&!document.querySelector('img'),'literal text only');
  let failed=false;try{await measurePlainText(document,{...opts,width:0});}catch{failed=true;}
  assert(failed&&document.body.children.length===before,'invalid input and cleanup');
  const makeBlock=(id)=>({kind:'block',origin:{documentId:'demo',revision:'1',blockKey:id},width:wide.width,unitHeights:[wide.height],splitPolicy:'strict'});
  const plan=paginateMeasured({schemaVersion:1,revision:'1',fingerprint:'browser-smoke',content:{width:wide.width,height:wide.height},sections:[{id:'demo',startOn:'page',blocks:[makeBlock('a'),makeBlock('b')]}]});
  assert(plan.completeness==='full'&&plan.pages.length===2&&!plan.publicationReady,'measured blocks paginate');
  const original='日本語の原稿を実測します。 Café and English text with spaces. '.repeat(5);
  const request={text:original,width:65000,fontSize:4200,fontFamily:'sans-serif',lineHeight:1.8};
  const lines=await measurePlainTextLines(document,request);
  assert(lines.lines.length>3,'multiple browser lines');
  const boundaries=new Set([...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(original)].map(g=>g.index));boundaries.add(original.length);
  assert(lines.lines.every(l=>boundaries.has(l.start)&&boundaries.has(l.end)),'grapheme boundaries');
  assert(lines.lines.map(l=>original.slice(l.start,l.end)).join('')===original,'lossless logical text');
  const preview=await createPlainTextPagePreview(document,{revision:'1',fingerprint:'line-preview',width:65000,height:lines.lines[0].height*3,blocks:[{origin:{documentId:'demo',revision:'1',blockKey:'line-block',range:{start:100,end:100+original.length}},request,splitPolicy:'allow',sourceTextStart:100}]});
  assert(preview.slices.every(s=>s.sourceSlice.start===100+s.textStart&&s.sourceSlice.end===100+s.textEnd),'explicit contiguous source mapping');
  document.body.append(preview.element);
  const rendered=[...preview.element.shadowRoot.querySelectorAll('[data-start]')];
  assert(rendered.map(x=>x.textContent).join('')===original,'preview text order');
  assert(preview.plan.pages.length>1&&preview.slices.map(s=>original.slice(s.textStart,s.textEnd)).join('')===original,'split across pages with exact logical offsets');
  for(const fragment of preview.element.shadowRoot.querySelectorAll('[data-block]')){
    const r=fragment.getBoundingClientRect(),p=fragment.parentElement.getBoundingClientRect();
    assert(r.bottom<=p.bottom+0.1&&r.right<=p.right+0.1,'fragment bounds');
    for(const line of fragment.children)assert(line.scrollWidth<=line.clientWidth+1,'frozen line fits');
  }
  assert(preview.publicationReady===false&&!preview.plan.publicationReady,'preview cannot authorize publication');
  let rejected=false;try{await measurePlainTextLines(document,{...request,text:'a\nb'});}catch{rejected=true;}
  assert(rejected,'unsupported line contexts refused');
  preview.element.remove();
  assert(document.body.children.length===before,'measurement cleanup');
  const weighted=await measurePlainTextLines(document,{...request,fontFamily:'monospace',fontWeight:700});
  assert(weighted.request.fontWeight===700,'weight preserved');
  const weightedPreview=await createPlainTextPagePreview(document,{revision:'2',fingerprint:'font-weight',width:65000,height:200000,blocks:[{origin:{documentId:'demo',revision:'2',blockKey:'weight'},request:{...request,fontFamily:'monospace',fontWeight:700},splitPolicy:'allow'}]});
  assert(weightedPreview.element.shadowRoot.querySelector('[data-start]').style.fontWeight==='700','rendered weight matches measurement');
  for(const patch of [{fontFamily:'BCFont_missing'},{fontFamily:'serif; color:red'},{fontWeight:901}]){
    let failed=false;try{await measurePlainTextLines(document,{...request,...patch});}catch{failed=true;}
    assert(failed,'missing registered font or invalid settings must fail');
  }
  assert(document.body.children.length===before,'font failure cleanup');
  const makeText=(id,key,text,extra={})=>({origin:{documentId:id,revision:'1',blockKey:key},request:{...request,text},splitPolicy:'strict',...extra});
  const sectionPreview=await createPlainTextPagePreview(document,{revision:'3',fingerprint:'book',width:65000,height:200000,paper:{width:100000,height:230000,inner:20000,outer:15000,top:10000,bottom:20000,firstSide:'right'},sections:[
    {id:'a',startOn:'page',blocks:[makeText('a','0','First')]},
    {id:'b',startOn:'continuous',blocks:[makeText('b','0','Second',{startPosition:'page-top',startPositionSource:'component'}),{kind:'pagebreak',origin:{documentId:'b',revision:'1',blockKey:'break'}},makeText('b','1','Third')]},
    {id:'c',startOn:'page',blocks:[makeText('c','0','Fourth')]}]});
  assert(sectionPreview.plan.pages.length===3,'sections and explicit break');
  assert(sectionPreview.plan.pages[0].fragments.map(f=>f.origin.documentId).join(',')==='a,b','continuous heading suppression');
  const sheets=sectionPreview.element.shadowRoot.querySelectorAll('[data-page]');
  assert(sheets[0].dataset.side==='right'&&sheets[1].dataset.side==='left','page parity');
  assert(parseFloat(sheets[0].querySelector('[data-block]').style.left)>parseFloat(sheets[1].querySelector('[data-block]').style.left),'mirrored margins');
  const component={direction:'row',gap:3000,padding:2000,background:'#f0f0f0',textColor:'#224466',children:[{id:'bar',type:'rect',width:2000,height:18000,color:'#315b86'},{id:'content',type:'content'}]};
  const decorated=await createPlainTextPagePreview(document,{revision:'4',fingerprint:'component',width:65000,height:150000,blocks:[makeText('sample','head','Long Japanese heading 日本語の見出し',{component})]});
  const deco=decorated.element.shadowRoot.querySelector('[data-component]');
  assert(decorated.plan.pages[0].fragments[0].rect.height>=22000,'padding and decorative height included in pagination');
  assert(deco.querySelector('[data-component-node=bar]').getAttribute('aria-hidden')==='true','decorative rectangle excluded from semantics');
  assert(deco.querySelector('[data-content-slot]').textContent==='Long Japanese heading 日本語の見出し','exact text slot');
  assert(decorated.slices[0].textEnd==='Long Japanese heading 日本語の見出し'.length,'strict component source range');
  assert(parseFloat(deco.querySelector('[data-content-slot]').style.left)>parseFloat(deco.querySelector('[data-component-node=bar]').style.left),'row layout order');
  const column=await createPlainTextPagePreview(document,{revision:'4',fingerprint:'column',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:{...component,direction:'column',children:[{id:'content',type:'content'},{id:'bar',type:'rect',width:'fill',height:2000,color:'#315b86'}]}})]});
  const col=column.element.shadowRoot.querySelector('[data-component]');
  assert(parseFloat(col.querySelector('[data-component-node=bar]').style.top)>parseFloat(col.querySelector('[data-content-slot]').style.top),'column order');
  let rejectedComponent=false;try{await createPlainTextPagePreview(document,{revision:'4',fingerprint:'bad-component',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:{...component,children:[{id:'a',type:'content'},{id:'b',type:'content'}]}})]});}catch{rejectedComponent=true;}
  assert(rejectedComponent,'duplicate semantic slot rejected');
  const labelComponent={...component,direction:'column',children:[{id:'kicker',type:'label',width:'fill',text:'CHAPTER',fontFamily:'monospace',fontWeight:700,fontSize:3000,lineHeight:1.5,color:'#224466'},{id:'content',type:'content'}]};
  const labeled=await createPlainTextPagePreview(document,{revision:'5',fingerprint:'label',width:65000,height:150000,blocks:[{...makeText('sample','head','Original heading',{component:labelComponent}),origin:{documentId:'sample',revision:'1',blockKey:'head',range:{start:10,end:26}},sourceTextStart:10}]});
  const fixed=labeled.element.shadowRoot.querySelector('[data-fixed-label]');
  assert(fixed.textContent==='CHAPTER'&&fixed.firstElementChild.style.fontFamily==='monospace'&&fixed.firstElementChild.style.fontWeight==='700','fixed label independent font');
  assert(labeled.slices.length===1&&labeled.slices[0].sourceSlice.start===10&&labeled.slices[0].sourceSlice.end===26,'label does not change source slice');
  assert(labeled.element.shadowRoot.querySelector('[data-content-slot]').textContent==='Original heading','original heading unchanged');
  assert(parseFloat(fixed.style.top)<parseFloat(labeled.element.shadowRoot.querySelector('[data-content-slot]').style.top),'label flow order');
  const nested={...component,children:[{id:'bar',type:'rect',width:2000,height:18000,color:'#315b86'},{id:'group',type:'group',width:'fill',direction:'column',gap:1000,padding:2000,background:'#eeeeee',children:labelComponent.children}]};
  const nestedPreview=await createPlainTextPagePreview(document,{revision:'6',fingerprint:'nested',width:65000,height:150000,blocks:[makeText('sample','head','Original heading',{component:nested})]});
  const group=nestedPreview.element.shadowRoot.querySelector('[data-component-group]');
  assert(group.querySelector('[data-fixed-label]').textContent==='CHAPTER','nested label');
  assert(group.querySelector('[data-content-slot]').textContent==='Original heading','nested content');
  assert(parseFloat(group.style.left)>parseFloat(nestedPreview.element.shadowRoot.querySelector('[data-component-node=bar]').style.left),'nested group row position');
  assert(parseFloat(group.querySelector('[data-content-slot]').style.top)>parseFloat(group.querySelector('[data-fixed-label]').style.top),'nested group column position');
  assert(nestedPreview.plan.pages[0].fragments[0].rect.height>=22000,'nested height in plan');
  let badGroup=false;try{await createPlainTextPagePreview(document,{revision:'6',fingerprint:'invalid',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:{...nested,children:[...nested.children,{id:'extra',type:'rect',width:'fill',height:1000,color:'#123456'}]}})]});}catch{badGroup=true;}
  assert(badGroup,'ambiguous flexible row rejected');
  const canvas={...component,direction:'column',children:[{id:'canvas',type:'group',direction:'canvas',width:'fill',height:50000,gap:0,padding:2000,background:'#eeeeee',children:[{id:'bg',type:'rect',x:1000,y:1000,width:40000,height:30000,color:'#abcdef'},{id:'title',type:'content',x:3000,y:5000,width:35000},{id:'label',type:'label',x:3000,y:25000,width:25000,text:'CHAPTER',fontFamily:'monospace',fontWeight:400,fontSize:3000,lineHeight:1.5,color:'#224466'}]}]};
  const canvasPreview=await createPlainTextPagePreview(document,{revision:'7',fingerprint:'canvas',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:canvas})]});
  const cn=canvasPreview.element.shadowRoot.querySelector('[data-component-canvas]');
  const ct=cn.querySelector('[data-content-slot]');
  assert(Math.abs(parseFloat(ct.style.left)-5000*96/25400)<.02,'canvas exact x including padding');
  assert(Math.abs(parseFloat(ct.style.top)-7000*96/25400)<.02,'canvas exact y including padding');
  assert(canvasPreview.plan.pages[0].fragments[0].rect.height===54000,'fixed canvas height in plan');
  assert(cn.children[0].dataset.componentNode==='bg'&&cn.children[1]===ct,'canvas paint order');
  assert(canvasPreview.slices.length===1&&canvasPreview.slices[0].textEnd===7,'canvas source slice');
  for(const [x,y] of [[40000,5000],[3000,49000]]){
    const bad={...canvas,children:[{...canvas.children[0],children:canvas.children[0].children.map(n=>n.id==='title'?{...n,x,y}:n)}]};
    let rejected=false;try{await createPlainTextPagePreview(document,{revision:'7',fingerprint:'bad-canvas',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:bad})]});}catch{rejected=true;}
    assert(rejected,'canvas overflow rejected');
  }
  // Four distinct source columns, two rows. Cover crops the central two columns.
  const imageId='a'.repeat(64),png=new Blob([Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAIAAADwyuo0AAAAGUlEQVR4nGP4z8DA8J+BgeH/////mRiQAABryAX9SqklXwAAAABJRU5ErkJggg=='),c=>c.charCodeAt(0))],{type:'image/png'});
  const imageNode={id:'art',type:'image',assetId:imageId,width:20000,height:20000,fit:'contain',alt:'Sample illustration'};
  const picture={...component,direction:'column',children:[imageNode,{...imageNode,id:'cover',fit:'cover',alt:''},{id:'content',type:'content'}]};
  let resolves=0;
  const imageOptions={revision:'8',fingerprint:'image',width:65000,height:150000,blocks:[makeText('sample','head','Heading',{component:picture})],resolveImage:async id=>{assert(id===imageId,'resolve ID only');resolves++;return png;}};
  const picturePreview=await createPlainTextPagePreview(document,imageOptions);
  assert(resolves===1,'shared image decoded once');
  const contain=picturePreview.element.shadowRoot.querySelector('[data-component-node=art] canvas'),cover=picturePreview.element.shadowRoot.querySelector('[data-component-node=cover] canvas');
  assert(contain.width===4&&contain.height===2&&Math.abs(parseFloat(contain.style.height)-10000*96/25400)<.02,'contain preserves ratio and centers');
  assert(cover.width===2&&cover.height===2&&Math.abs(parseFloat(cover.style.height)-20000*96/25400)<.02,'cover uses full box');
  const pixels=cover.getContext('2d').getImageData(0,0,2,1).data;
  assert(pixels[1]===255&&pixels[6]===255&&pixels[0]===0&&pixels[4]===0,'cover crops source without distortion');
  assert(contain.getAttribute('aria-label')==='Sample illustration'&&cover.getAttribute('aria-hidden')==='true','image semantics');
  assert(picturePreview.plan.pages[0].fragments[0].rect.height>44000&&picturePreview.slices[0].textEnd===7,'image geometry included without extra source slices');
  const cropped={...imageNode,crop:{left:2500,top:0,right:2500,bottom:0}};
  const cropPreview=await createPlainTextPagePreview(document,{...imageOptions,blocks:[makeText('sample','head','Heading',{component:{...picture,children:[cropped,{id:'content',type:'content'}]}})]});
  const croppedCanvas=cropPreview.element.shadowRoot.querySelector('[data-component-image] canvas');
  assert(croppedCanvas.width===2&&croppedCanvas.height===2,'explicit crop before contain');
  assert(croppedCanvas.getContext('2d').getImageData(0,0,2,1).data[1]===255,'cropped pixels reflect inset');
  assert(cropPreview.slices[0].textEnd===7,'crop does not affect source mapping');
  let badCrop=false;try{await createPlainTextPagePreview(document,{...imageOptions,blocks:[makeText('sample','head','Heading',{component:{...picture,children:[{...cropped,crop:{left:9000,top:0,right:1000,bottom:0}},{id:'content',type:'content'}]}})]});}catch{badCrop=true;}
  assert(badCrop,'empty crop rejected');
  const inCanvas={...canvas,children:[{...canvas.children[0],children:[{...imageNode,x:1000,y:1000},...canvas.children[0].children.slice(1)]}]};
  const imageCanvas=await createPlainTextPagePreview(document,{...imageOptions,blocks:[makeText('sample','head','Heading',{component:inCanvas})]});
  assert(imageCanvas.element.shadowRoot.querySelector('[data-component-canvas] > [data-component-image] canvas')!==null,'image in Canvas');
  for(const invalid of [
    {...imageOptions,resolveImage:undefined},
    {...imageOptions,resolveImage:async()=>new Blob(['bad'],{type:'image/png'})},
    {...imageOptions,blocks:[makeText('sample','head','Heading',{component:{...picture,children:[{...imageNode,assetId:'https://example.com/a.png'},{id:'content',type:'content'}]}})]},
    {...imageOptions,blocks:[makeText('sample','head','Heading',{component:{...picture,children:[{...imageNode,height:0},{id:'content',type:'content'}]}})]}
  ]){
    let failed=false;try{await createPlainTextPagePreview(document,invalid);}catch{failed=true;}
    assert(failed,'invalid image resource or geometry rejected');
  }
  result.textContent='PASS '+JSON.stringify({lineCount:lines.lines.length,previewPages:preview.plan.pages.length,lineRanges:preview.slices.map(s=>[s.textStart,s.textEnd])})+' '+JSON.stringify({wide,narrow,pages:plan.pages.length});
}catch(error){result.textContent='FAIL '+String(error);}
await fetch('/test-result',{method:'POST',body:result.textContent});
</script></body></html>
