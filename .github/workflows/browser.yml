name: Browser measurement smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # Exercise native delimiter assemblies with a real OpenType MATH font.
      - run: sudo apt-get update && sudo apt-get install -y fonts-texgyre-math
      - name: Select a real OpenType MATH fixture
        run: |
          FONT="$(fc-match -f '%{file}' 'TeX Gyre Termes Math')"
          test -f "$FONT"
          echo "BC_TEST_MATH_FONT=$FONT" >> "$GITHUB_ENV"
      - run: google-chrome --version && npm run test:browser
